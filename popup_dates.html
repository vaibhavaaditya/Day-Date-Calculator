<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style_dates.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Dates page</title>
  </head>
  <body>
    <div id="ext_container">
      <div id="day_date_tabs">
        <div id="dates_mode" class="mode_selected">Dates</div>
        <div id="days_mode" class="mode_unselected">Days</div>
      </div>

      <div id="dates_form_container">
        <div id="input_form">
          <div id="date_select">
            <div id="from_date_container">
              <label for="from_date">From:</label>
              <input type="date" name="from_date" id="from_date" />
              <button id="today_frodate">Today</button>
            </div>

            <div id="to_date_container">
              <label for="to_date">To:</label>
              <input type="date" name="to_date" id="to_date" />
              <button id="today_todate">Today</button>
            </div>
          </div>
          <div id="preferences">
            <div>
              <label for="includedate">Include the end date?</label>
              <input type="checkbox" name="includedate" id="includedate" />
            </div>
            <div>
              <label for="workday">Count work days only?</label>
              <input type="checkbox" name="workday" id="workday" />
            </div>
          </div>
        </div>

        <div id="submit_container">
          <button id="submit">Submit</button>
        </div>
      </div>

      <div id="result_container">
        <p></p>
      </div>
    </div>
    <script src="popup_dates.js"></script>
  </body>
</html>
