<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Dates & Days Calculator</title>
  </head>
  <body>
    <div id="ext_container">
      <div id="main_content">
        <div class="header">
          <div id="day_date_tabs">
            <div id="dates_mode_btn" class="tab_button mode_selected">Dates</div>
            <div id="days_mode_btn" class="tab_button mode_unselected">Days</div>
          </div>
          <button id="theme_toggle_btn" title="Toggle Theme">
            <svg id="sun_icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moon_icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>

        <!-- Dates Mode Form -->
        <div id="dates_form_container" class="form_container">
          <div class="form_row form_row_inputs">
            <div class="input_group">
              <label for="dates_from_date">From:</label>
              <input type="date" name="from_date" id="dates_from_date" />
              <button class="today_btn" data-target="dates_from_date">Today</button>
            </div>
            <div class="input_group">
              <label for="to_date">To:</label>
              <input type="date" name="to_date" id="to_date" />
              <button class="today_btn" data-target="to_date">Today</button>
            </div>
          </div>
          <div class="form_row form_row_actions">
            <div class="preferences">
              <div class="toggle_container">
                <label class="toggle_label_text" for="includedate">Include the end date?</label>
                <label class="toggle_switch">
                  <input type="checkbox" id="includedate" name="includedate" />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="toggle_container">
                <label class="toggle_label_text" for="dates_workday">Count weekdays only?</label>
                <label class="toggle_switch">
                  <input type="checkbox" id="dates_workday" name="workday" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="submit_container">
              <button id="dates_submit">Submit</button>
            </div>
          </div>
        </div>

        <!-- Days Mode Form (initially hidden) -->
        <div id="days_form_container" class="form_container hidden">
          <div class="form_row form_row_inputs">
            <div class="input_group">
              <label for="days_from_date">From:</label>
              <input type="date" name="from_date" id="days_from_date" />
              <button class="today_btn" data-target="days_from_date">Today</button>
            </div>
            <div class="input_group">
              <label for="add_or_sub">Operation:</label>
              <select id="add_or_sub">
                <option value="add">(+) Add</option>
                <option value="sub">(-) Subtract</option>
              </select>
            </div>
            <div class="input_group">
              <label for="add_sub_days">Days:</label>
              <input type="number" name="add_sub_days" id="add_sub_days" min="1" />
            </div>
          </div>
          <div class="form_row form_row_actions">
            <div class="preferences days_preferences">
              <div class="toggle_container">
                <label class="toggle_label_text" for="days_workday">Count weekdays only?</label>
                <label class="toggle_switch">
                  <input type="checkbox" id="days_workday" name="workday" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="submit_container">
              <button id="days_submit">Submit</button>
            </div>
          </div>
        </div>
        <div id="result_container" class="hidden"></div>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
